<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lievitati Scacchiera</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#d9561a">
<link rel="icon" href="icona-192.png">
<link rel="apple-touch-icon" href="icona-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: app a schermate, una per volta. In alto avanzamento, al centro la schermata, in basso i tasti.
   Senza preparazione: guida in 7 schermate. Con preparazione: solo "Adesso", più il Riepilogo a richiesta. */
:root{
  --bg:#f3f1ed; --surface:#ffffff; --raise:#f5f2ee; --line:#e2ddd5;
  --ink:#231a14; --muted:#6f6359; --ember:#d9561a; --ember-soft:#fde7d9; --tomato:#c8321d; --basil:#2f7d36; --dough:#9a5b12;
  --display:"Big Shoulders Display","Arial Narrow",sans-serif;
  --body:"Figtree","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45;overflow:hidden}
.app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg)}
#top{padding:12px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);min-height:52px}
#top .brand{font-family:var(--display);font-weight:800;font-size:1.25rem;flex:1}
#top .cnt{font-weight:700;font-size:.9rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.pbar{flex:1;height:12px;border-radius:999px;background:#e4ded5;overflow:hidden}
.pbar div{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--ember),#f0a03a);transition:width .4s}
.pbar.full div{background:var(--basil)}
#view{flex:1;overflow-y:auto;padding:18px 16px 24px;display:flex;flex-direction:column;gap:14px}
#bar{padding:10px 16px 12px;display:flex;gap:10px;border-top:1px solid var(--line);background:var(--surface)}
h1,h2,h3{font-family:var(--display);line-height:1.02;margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:2.5rem;font-weight:900}
h2{font-size:1.5rem;font-weight:800}
p{margin:0}
.sub{color:var(--muted)}
.lbl{font-size:.8rem;text-transform:uppercase;letter-spacing:.12em;color:var(--ember);font-weight:700}
.txt{font-size:1.2rem}
.note{color:var(--muted)}
.next{color:var(--muted);border-top:1px dashed var(--line);padding-top:12px;margin-top:auto}
.cd{font-family:var(--display);font-weight:900;font-size:3.6rem;line-height:1;color:var(--ember);font-variant-numeric:tabular-nums}
.clockbox{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:2px solid var(--ember);border-radius:18px;padding:12px 16px}
.clockbox.over{border-color:var(--basil)}
.clockbox.over .cd{color:var(--basil)}
.btn{font:inherit;font-weight:700;font-size:1.05rem;border:0;background:var(--ember);color:#fff;border-radius:999px;padding:14px 18px;cursor:pointer;flex:1}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;color:var(--ember);border:1.5px solid var(--ember)}
.btn.small{flex:none;font-size:.92rem;padding:8px 14px;align-self:flex-start}
.btn.big{flex:2}
.btn:disabled{opacity:.4}
.btn.danger{color:var(--tomato);border-color:var(--tomato)}
:focus-visible{outline:3px solid var(--ember);outline-offset:2px}
label{font-size:.88rem;color:var(--muted);display:flex;flex-direction:column;gap:6px}
input[type=number],input[type=datetime-local],select{font:inherit;font-weight:600;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;width:100%}
input::placeholder{color:#a3978c;font-weight:400}
input:focus,select:focus{border-color:var(--ember);outline:none}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chip{font:inherit;text-align:left;border:1px solid var(--line);border-radius:14px;padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:2px;background:var(--surface);color:var(--ink)}
.chip b{font-weight:700}
.chip span{font-size:.83rem;color:var(--muted)}
.chip.on{border-color:var(--ember);background:var(--ember-soft);box-shadow:0 0 0 1px var(--ember) inset}
.chip.on b{color:var(--ember)}
.msg{padding:12px 14px;border-radius:14px;background:var(--surface);border-left:4px solid #e0a64a}
.msg.bad{border-left-color:var(--tomato);background:#fbe9e5}
.msg.good{border-left-color:var(--basil);background:#e7f3e6}
.stack{display:flex;flex-direction:column;gap:8px}
.art{width:100%;height:120px;border-radius:18px;display:block}
.result{background:var(--ember-soft);border-radius:16px;padding:14px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.result div{display:flex;flex-direction:column;gap:2px}
.result b{font-family:var(--display);font-size:2.4rem;font-weight:900;line-height:1;font-variant-numeric:tabular-nums;color:var(--ember)}
.result div:last-child b{color:var(--ink)}
.result span{font-size:.8rem;color:var(--muted)}
ol.chain{margin:0;padding-left:24px;display:flex;flex-direction:column;gap:6px;font-variant-numeric:tabular-nums}
ol.chain li::marker{color:var(--ember);font-weight:700}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;background:var(--surface);border-radius:16px;overflow:hidden}
th{font-size:.75rem;color:var(--muted);font-weight:600;text-align:right;padding:10px 12px 4px;text-transform:uppercase;letter-spacing:.06em}
th:first-child{text-align:left}
td{padding:10px 12px;border-bottom:1px dashed var(--line)}
td.v{text-align:right;font-family:var(--display);font-weight:800;font-size:1.6rem;white-space:nowrap}
tr:last-child td{border-bottom:0}
td small{display:block;color:var(--muted);font-size:.8rem}
.pills{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.pill{background:var(--surface);border-radius:14px;padding:10px}
.pill b{display:block;font-family:var(--display);font-size:1.5rem;font-weight:800;font-variant-numeric:tabular-nums}
.pill span{font-size:.78rem;color:var(--muted)}
ul.rules{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
ul.rules li{padding-left:14px;border-left:3px solid var(--ember-soft)}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--surface);padding:4px;border-radius:999px;border:1px solid var(--line)}
.tab{font:inherit;font-weight:700;font-size:.85rem;border:0;background:transparent;color:var(--muted);border-radius:999px;padding:9px 2px;cursor:pointer}
.tab.on{background:var(--ember);color:#fff}
h3.grp{font-family:var(--body);font-size:.8rem;font-weight:700;color:var(--dough);text-transform:uppercase;letter-spacing:.12em;margin-top:6px}
ul.list{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.row{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;background:var(--surface);border-radius:14px;padding:10px 12px;border:1px solid transparent}
.row.cur{border-color:var(--ember);background:var(--ember-soft)}
.row.done summary b{text-decoration:line-through;color:var(--muted)}
.chk{width:30px;height:30px;border-radius:50%;border:2px solid var(--ember);background:#fff;cursor:pointer;padding:0;display:grid;place-items:center;margin-top:2px}
.chk.on{background:var(--basil);border-color:var(--basil)}
.chk.on::after{content:"";width:8px;height:14px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-2px)}
summary{cursor:pointer;list-style:none;display:flex;flex-direction:column}
summary::-webkit-details-marker{display:none}
summary .when{font-size:.82rem;font-weight:700;color:var(--ember);font-variant-numeric:tabular-nums}
summary b{font-size:1.05rem}
details p{margin-top:6px;color:var(--muted);font-size:.95rem}
.howto{margin:8px 0 0;background:#faf7f2;border:1px solid var(--line);border-radius:14px;padding:8px;display:flex;flex-direction:column;gap:6px}
.howto canvas{width:100%;aspect-ratio:4/3;display:block;border-radius:10px}
.howto figcaption{font-weight:600;font-size:.95rem;min-height:2.8em;padding:0 4px}
.switch{flex-direction:row;align-items:center;gap:8px;color:var(--ink);font-size:.95rem;cursor:pointer}
.switch input{width:22px;height:22px;accent-color:var(--ember)}
.bell{font:inherit;font-size:.8rem;font-weight:700;border-radius:999px;padding:5px 10px;border:1.5px solid var(--tomato);color:var(--tomato);background:#fbe9e5;cursor:pointer;white-space:nowrap}
.bell.on{border-color:var(--basil);color:var(--basil);background:#e7f3e6}
.btn.nav{flex:none;padding:14px 12px;font-size:.95rem}
.job{font:inherit;color:var(--ink);text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px;cursor:pointer}
.job b{font-family:var(--display);font-size:1.4rem;font-weight:800;line-height:1.05}
.job .pbar{flex:none}
.job .st{font-weight:600;font-variant-numeric:tabular-nums}
.job .st.hot{color:var(--ember)}
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.qs{display:flex;flex-direction:column;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.q b{display:block;margin-bottom:6px}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{font:inherit;font-weight:600;font-size:.95rem;border:1.5px solid var(--line);background:var(--raise);color:var(--ink);border-radius:12px;padding:10px 12px;cursor:pointer;flex:1 1 auto;min-width:44px;text-align:center}
.opt.on{border-color:var(--ember);background:var(--ember-soft);color:var(--ember)}
.rate{display:grid;grid-template-columns:96px 1fr;gap:8px;align-items:center}
.rate .opts{flex-wrap:nowrap;gap:5px}
.rate .opt{padding:10px 0;min-width:0;flex:1 1 0}
textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;width:100%;resize:vertical}
.phs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.phs:empty{display:none}
.ph{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;background:var(--raise);display:block}
.hcard{font:inherit;color:var(--ink);text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;display:grid;grid-template-columns:72px 1fr;gap:12px;align-items:center;cursor:pointer}
.hcard .ph{width:72px;height:72px}
.hcard b{font-family:var(--display);font-size:1.25rem;font-weight:800;line-height:1.05;display:block}
.stars{color:var(--ember);font-weight:700;letter-spacing:.05em}
.plrow{display:grid;grid-template-columns:1fr 80px auto auto;gap:8px;align-items:center;background:var(--surface);border-radius:12px;padding:8px}
.plrow input[type=text]{font:inherit;font-weight:600;color:var(--ink);background:var(--raise);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%}
.plrow input[type=number]{padding:10px}
.mini{font-size:.82rem;color:var(--muted);display:flex;align-items:center;gap:4px}
.x{font:inherit;font-weight:700;border:0;background:transparent;color:var(--tomato);font-size:1.2rem;cursor:pointer;padding:6px}
.upd{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);z-index:20;font:inherit;font-weight:700;border:0;border-radius:999px;padding:12px 18px;background:var(--basil);color:#fff;box-shadow:0 6px 20px rgba(0,0,0,.25);cursor:pointer;max-width:92vw}
.ver{font-size:.8rem;color:var(--muted);text-align:center}
.dots{display:flex;gap:5px}
.dots i{width:8px;height:8px;border-radius:50%;background:#d9d2c8}
.dots i.on{background:var(--ember)}
</style>
</head>
<body>
<div class="app">
  <div id="top"></div>
  <main id="view"></main>
  <div id="bar"></div>
</div>
<input type="file" id="pick" accept="image/*" capture="environment" hidden>
<input type="file" id="loadb" accept="application/json,.json" hidden>
<script>
(function(){
  'use strict';
  const $=id=>document.getElementById(id);
  const store={
    get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},
    set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
  };
  const pad=n=>(n<10?'0':'')+n;
  const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
  const num=(v,d)=>(v===''||v==null||!isFinite(+v))?d:+v;
  const gr=x=>Math.round(x).toLocaleString('it-IT')+' g';
  const gr1=x=>(Math.round(x*10)/10).toLocaleString('it-IT',{minimumFractionDigits:1,maximumFractionDigits:1})+' g';
  const t1=x=>(Math.round(x*10)/10).toLocaleString('it-IT',{maximumFractionDigits:1});
  const toInput=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes());
  const fmtT=ms=>new Date(ms).toLocaleString('it-IT',{weekday:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
  const hm=ms=>{const d=new Date(ms);return pad(d.getHours())+':'+pad(d.getMinutes())};
  const left=ms=>{const s=Math.max(0,Math.round(ms/1000)),h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h?h+' h '+pad(m)+' min':pad(m)+':'+pad(s%60)};
  const hmin=m=>Math.floor(m/60)+' h '+pad(m%60)+' min';

  /* ---- Prodotti: ogni prodotto ha i suoi parametri. Pane, grandi lievitati e dolci arriveranno qui. ---- */
  const PRODUCTS={
    'teglia-classica':{name:'Pizza in teglia classica',d:'Alveolata, base croccante. 63% di acqua, 50 minuti di lievitazione in teglia.',idr:63,olio:2,proof:50,w:{'60':850,'46':475}},
    'teglia-alta':{name:'Pizza in teglia alta e soffice',d:'Tipo focaccia, mollica alta. 68% di acqua, 90 minuti di lievitazione in teglia.',idr:68,olio:3,proof:90,w:{'60':1100,'46':700}},
    'teglia-sottile':{name:'Pizza in teglia sottile e croccante',d:'Bassa e friabile. 60% di acqua, 35 minuti di lievitazione in teglia.',idr:60,olio:2,proof:35,w:{'60':600,'46':380}}
  };
  const SOON=[['Pane',['Pane comune','Pane di grano duro','Ciabatta']],['Grandi lievitati',['Panettone','Colomba','Focaccia veneta']],['Dolci',['Brioche','Krapfen']]];

  /* ---- Impastatrici ---- */
  const MIXERS={
    mono:{name:'Spirale a una velocità',d:'Come la Cuppone',cap:30,fric:5,cv:6,work:25,
      rule:'Una sola velocità: si lavora a intervalli e si controlla l\'incordatura con la prova del velo. Conta 12-16 minuti di lavoro effettivo. Il rompipasta al centro va sempre tenuto montato.'},
    spirale2:{name:'Spirale a due velocità',d:'1ª amalgama, 2ª incorda',cap:30,fric:8,cv:6,work:25,
      rule:'Prima velocità per amalgamare e assorbire, seconda solo 3-5 minuti per incordare. La seconda scalda molto.'},
    forcella:{name:'Forcella',d:'Lavora piano, scalda poco',cap:20,fric:3,cv:5,work:30,
      rule:'La forcella scalda poco ma serve più tempo: 8-12 minuti oltre l\'assorbimento. Si ferma quando l\'impasto è liscio e non si attacca ai bracci.'},
    planetaria:{name:'Planetaria con gancio',d:'Piccoli lotti',cap:2,fric:7,cv:1,work:30,
      rule:'Gancio a uncino, velocità minima e poi la 2. Fermati ogni 3-4 minuti per non surriscaldare il motore.'},
    mano:{name:'A mano',d:'Pieghe ogni 30 minuti',cap:4,fric:1,cv:0.5,work:40,
      rule:'A mano il glutine si costruisce con le pieghe ogni 30 minuti, non con la fatica. Non scalda l\'impasto.'}
  };
  function mixSteps(key,c){
    c=c||{};
    const st=(h,p,dur,o)=>Object.assign({h:h,p:p,dur:dur,timer:false},o||{});
    const T={timer:true};
    const carica=x=>st('Carica la vasca','Metti '+c.acIn+' di acqua a '+c.tm+' °C e poi '+c.fl+' di farina.'+(x||''),3,{note:'Mescola acqua calda e fredda in un secchio finché il termometro segna '+c.tm+' °C. Tieni da parte altri '+c.res+' di acqua a '+c.tr+' °C per lievito e sale.'});
    const auto=m=>st('Autolisi','Ferma la macchina, copri la vasca e lascia riposare '+m+' minuti.',m,{timer:true,note:'Farina e acqua si legano da sole: dopo serve meno lavoro in macchina e l\'impasto si stende meglio.'});
    const lv=(how,m)=>st('Aggiungi il lievito','Sciogli '+c.lv+' di lievito fresco in metà dell\'acqua tenuta da parte ('+c.tr+' °C) e versalo. '+how,m,T);
    const sa=(how,m)=>st('Aggiungi il sale','Versa il sale ('+c.sa+') sciolto nell\'altra metà dell\'acqua tenuta da parte. '+how,m,T);
    const temp=st('Misura la temperatura','Termometro al centro dell\'impasto. Obiettivo '+c.tgt+' °C, va bene da '+c.tlo+' a '+c.thi+' °C.',1,{meas:true});
    const rip=st('Riposo in vasca','Copri la vasca e lascia riposare 20 minuti.',20,T);
    const vas=st('In vaschetta e pieghe','Ungi con un filo d\'olio il fondo e i bordi di '+c.vasch+' (non l\'impasto) e dividi l\'impasto. Con le mani bagnate tira un lembo verso l\'alto e ripiegalo sul centro, gira di un quarto e ripeti: 4 pieghe per giro, 2 giri.',15,{timer:true,anim:'fold',note:'Deve diventare una pagnotta liscia e bombata. Se lo è già, premi Fatto. Se la superficie resta grezza o strappata, aspetta il timer e ripeti le pieghe.'});
    const frigo=st('Copri e in frigo','Copri bene le vaschette con il coperchio o con la pellicola tesa sopra il bordo, senza olio sull\'impasto, e mettile in frigo ('+c.fr+' °C).',0,{note:'L\'impasto deve stare alto 5-8 cm per poter raddoppiare.'});
    const velo='Fai la prova del velo: se si strappa subito, lavora ancora 1-2 minuti.';
    let L;
    if(key==='mono')L=[carica(),
      st('Mescola per amalgamare','Velocità unica, 3-4 minuti, finché non c\'è più farina asciutta. Niente lievito né sale.',4,T),auto(25),
      lv('Impasta 3 minuti.',3),sa('Impasta 4-5 minuti fino ad assorbimento.',5),
      st('Olio e incordatura','Versa l\'olio ('+c.ol+') a filo e continua 3-6 minuti, fermandoti ogni 2 per controllare. Fermati quando l\'impasto si stacca dalla vasca.',6,{timer:true,anim:'veil',note:velo+' Se il gancio gira senza lavorare l\'impasto, ferma, raccogli dai bordi e riparti.'}),
      temp,rip,vas,frigo];
    else if(key==='spirale2')L=[carica(),
      st('Mescola in prima velocità','4 minuti, solo per amalgamare. Niente lievito né sale.',4,T),auto(25),
      lv('Prima velocità per 5 minuti.',5),sa('Prima velocità fino ad assorbimento, poi l\'olio ('+c.ol+') a filo.',5),
      st('Seconda velocità','3-5 minuti, finché l\'impasto si stacca dalla vasca e incorda. Non esagerare.',5,{timer:true,anim:'veil',note:velo}),
      temp,rip,vas,frigo];
    else if(key==='forcella')L=[carica(),
      st('Mescola per amalgamare','4 minuti, finché non c\'è più farina asciutta. Niente lievito né sale.',4,T),auto(25),
      lv('Impasta 4 minuti.',4),sa('Impasta 5 minuti fino ad assorbimento.',5),
      st('Olio e incordatura','Versa l\'olio ('+c.ol+') a filo e continua 8-12 minuti, controllando ogni 3, finché è liscio e si stacca dai bracci.',11,{timer:true,anim:'veil',note:velo}),
      temp,rip,vas,frigo];
    else if(key==='planetaria')L=[carica(),
      st('Mescola alla velocità minima','4 minuti, finché non c\'è più farina asciutta. Niente lievito né sale.',4,T),auto(25),
      lv('Velocità minima per 3 minuti.',4),sa('Velocità minima per 4 minuti.',5),
      st('Olio e incordatura','Versa l\'olio ('+c.ol+') a filo, poi seconda velocità per 3-4 minuti. Ferma il motore se si scalda.',5,{timer:true,anim:'veil',note:velo}),
      temp,rip,vas,frigo];
    else L=[carica(' Mescola con la mano per 5 minuti, finché non c\'è più farina asciutta.'),auto(30),
      lv('Incorporalo con il metodo a pinza, 5 minuti.',6),sa('Incorpora 5 minuti.',6),
      st('Aggiungi l\'olio','Versa l\'olio ('+c.ol+') a filo e incorpora 3 minuti.',4,T),temp,
      st('Prima piega','Tira i lembi dell\'impasto verso il centro, tutto il giro. Copri e aspetta 30 minuti.',30,{timer:true,anim:'fold'}),
      st('Seconda piega','Stessa piega, più delicata. Copri e aspetta 30 minuti.',30,{timer:true,anim:'fold'}),
      st('Terza piega','Ultima piega, poi 30 minuti di riposo. Ungi intanto il fondo e i bordi di '+c.vasch+'.',30,{timer:true,anim:'fold'}),
      frigo];
    return L;
  }

  /* ---- Stato ---- */
  const DEF={prod:'teglia-classica',n:12,fmt:'60',g:'',idr:'',mixer:'mono',cap:30,room:16,flourT:'',target:21,fric:'',fridge:4,room2:18,proofT:24,start:'',bake:''};
  let S=Object.assign({},DEF,store.get('lv-set')||{});

  function strength(ses){

  /* ---- Foto: restano nel telefono (IndexedDB), ridotte a 1280 px ---- */

    tx(mode,fn){return this.open().then(db=>new Promise((res,rej)=>{const t=db.transaction('foto',mode),st=t.objectStore('foto'),q=fn(st);t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error)}))},
    put(k,v){return this.tx('readwrite',st=>st.put(v,k))},

  const thumbs=(ses,key)=>(ses.photos||[]).filter(p=>!key||p.s===key).map(p=>'<img class="ph" data-ph="'+p.k+'" alt="Foto">').join('');

  /* ---- Calcolo ---- */
  function compute(inp,t0,yUsed){
    const P=PRODUCTS[inp.prod]||PRODUCTS['teglia-classica'],mx=MIXERS[inp.mixer]||MIXERS.mono;
    const n=Math.max(1,+inp.n||1),g=+inp.g||(inp.fmt==='altro'?800:P.w[inp.fmt]),idr=(+inp.idr||P.idr)/100,total=n*g;
    const capG=Math.max(0.5,+inp.cap||mx.cap)*1000,N=Math.max(1,Math.ceil(total/capG-1e-9));
    const room=num(inp.room,16),flT=num(inp.flourT,room),tgt=num(inp.target,21),fric=num(inp.fric,mx.fric);
    const fr=num(inp.fridge,4),r2=num(inp.room2,18),pT=num(inp.proofT,24);
    /* giorno del forno: più freddo = più tempo (circa il doppio ogni 8 °C) */
    const manual=inp.outH!=null&&inp.outH!==''&&+inp.outH>0;
    let outMin=inp.outH!=null&&inp.outH!==''&&+inp.outH>0?Math.round(+inp.outH*60):Math.round(clamp(150*Math.pow(2,(20-r2)/8),60,360)/5)*5;
    const proofMin=Math.round(clamp(P.proof*Math.pow(2,(24-pT)/8),20,240)/5)*5;
    const bake=new Date(inp.bake).getTime();
    const durSum=mixSteps(inp.mixer).reduce((a,s)=>a+s.dur,0)+(N-1)*mx.work;
    const fiPred=t0+durSum*60000;let out=bake-(proofMin+15+outMin)*60000;const hoursY=(out-fiPred)/3600000;
    /* lievito fresco: base 0,25% per 48 h a 4 °C con impasto a 21 °C, in linea con le dosi d'uso per la teglia a freddo */
    const base=hoursY>0?0.25*Math.pow(48/Math.max(hoursY,1),1.1):1;
    const yPct=clamp(base/Math.pow(2,(fr-4)/7)/Math.pow(2,(tgt-21)/10),0.08,1);
    /* se il lievito usato è meno di quello di riferimento, fuori dal frigo serve più tempo */
    if(yUsed&&!manual){outMin=Math.round(clamp(outMin*Math.pow(yPct/yUsed,0.7),60,900)/5)*5;out=bake-(proofMin+15+outMin)*60000}
    const fl=total/(1+idr+0.025+P.olio/100+yPct/100),ac=fl*idr;
    /* acqua: bilancio di calore di farina, acqua e vasca, poi calore dell'impastatrice e scambio con la sala */
    const kgB=total/N/1000,k=clamp(0.4/Math.sqrt(kgB),0.06,0.25);
    const Cf=fl/N/1000*1.7,Cw=ac/N/1000*4.18,Cv=mx.cv;
    const Tafter=(tgt-k*room)/(1-k),Tmix=Tafter-fric;
    const Tw=(Tmix*(Cf+Cw+Cv)-Cf*flT-Cv*room)/Cw,Tres=Tw>30?28:Tw,Tmain=(Tw-0.08*Tres)/0.92;
    return {P:P,mx:mx,n:n,g:g,idr:idr,total:total,capG:capG,N:N,bake:bake,fiPred:fiPred,out:out,hoursY:hoursY,
      foldOn:hoursY>20,nChk:hoursY>36?2:1,yPct:yPct,fl:fl,ac:ac,sa:fl*0.025,ol:fl*P.olio/100,lv:fl*yPct/100,
      room:room,flT:flT,tgt:tgt,fric:fric,fr:fr,r2:r2,pT:pT,outMin:outMin,proofMin:proofMin,k:k,Tafter:Tafter,Tmix:Tmix,Tw:Tw,Tres:Tres,Tmain:Tmain};
  }
  const FZ=['yPct','fl','ac','sa','ol','lv','Tw','Tres','Tmain','Tafter','Tmix','k','room','flT','tgt','fric','foldOn','nChk','total','n','g','idr','N','capG','hoursY'];

  /* ---- Lievitazione stimata dalle temperature registrate ----
     L'impasto si scalda o si raffredda verso l'ambiente con una costante di circa 3,2 ore (vaschetta da 5 kg,
     misurata il 16/11). La velocità del lievito raddoppia ogni 8 °C e crolla sotto i 12 °C. */
  const TAU=3.2*60;
  const fRate=T=>Math.pow(2,(T-20)/8)*(T<12?Math.pow(2,(T-12)/3):1);
  const isOut=ses=>{const l=(ses.log||[]).filter(e=>e.k==='out'||e.k==='in');return l.length>0&&l[l.length-1].k==='out'};
  function ferm(ses,r,tIn,outAt){
    const ev=(ses.log||[]).slice().sort((a,b)=>a.t-b.t),now=Date.now(),need=300*0.25/r.yPct /* minuti a 20 °C per raddoppiare: 5 h con lo 0,25% di lievito, tarato sull'impasto del 15/11 */,st=5*60000,kf=1-Math.exp(-5/TAU);
    let T=num(ses.meas,r.tgt),amb=r.fr,out=false,eq=0,t=tIn,i=0;const res={need:need,eta:null};
    const end=Math.max(now,tIn)+72*3600000;
    while(t<end){
      while(i<ev.length&&ev[i].t<=t){const e=ev[i++];if(e.k==='v'){eq=e.v*need;continue}if(e.k==='out')out=true;if(e.k==='in'){out=false;if(e.amb==null)amb=r.fr}if(e.amb!=null)amb=e.amb;if(e.dough!=null)T=e.dough}
      if(outAt!=null&&!out&&t>=now&&t>=outAt){out=true;amb=r.r2}
      if(res.now==null&&t>=now){res.now=eq;res.T=T;res.out=out;res.amb=amb}
      T+=(amb-T)*kf;eq+=5*fRate(T);
      if(res.eta==null&&eq>=need)res.eta=t;
      t+=st;
    }
    if(res.now==null){res.now=eq;res.T=T;res.out=out;res.amb=amb}
    return res;
  }
  const FC=new Map();
  function fermPlan(ses,r,tIn,target){
    const now=Date.now(),key=[(ses.log||[]).length,Math.floor(now/60000),target,r.r2,ses.inp.outH||'',!!ses.done.out,ses.meas||'',tIn].join('|'),c=FC.get(ses.t0);
    if(c&&c.key===key)return c.val;
    const base=ferm(ses,r,tIn,null);let outAt=null,eta=base.eta,late=false;
    if(!base.out&&!ses.done.out){
      const man=ses.inp.outH!=null&&ses.inp.outH!==''&&+ses.inp.outH>0;
      if(man)outAt=target-(+ses.inp.outH)*3600000;
      else{for(let t=target;t>=now;t-=15*60000){const f=ferm(ses,r,tIn,t);if(f.eta!=null&&f.eta<=target){outAt=t;break}}if(outAt==null)outAt=now}
      eta=ferm(ses,r,tIn,Math.max(outAt,now)).eta;
    }
    if(eta==null||eta>target+20*60000)late=true;
    const val={now:base.now,need:base.need,T:base.T,out:base.out,amb:base.amb,outAt:outAt,eta:eta,late:late,target:target};
    FC.set(ses.t0,{key:key,val:val});return val;
  }
  function addLog(ses,e){ses.log=ses.log||[];e.t=Date.now();ses.log.push(e);saveSes()}

  function build(inp,t0,ses){
    const r=compute(inp,t0,ses&&ses.fz?ses.fz.yPct:0);
    if(ses&&ses.fz)FZ.forEach(k=>{r[k]=ses.fz[k]});
    const N=r.N,res=Math.round(r.ac/N*0.08/10)*10,vn=Math.max(1,Math.ceil(r.total/6000));
    const c={fl:gr(r.fl/N),acIn:gr(r.ac/N-res),res:gr(res),lv:gr1(r.lv/N),sa:gr(r.sa/N),ol:gr(r.ol/N),
      tm:Math.round(clamp(r.Tmain,0,60)),tr:Math.round(clamp(r.Tres,0,30)),tgt:t1(r.tgt),tlo:t1(r.tgt-1),thi:t1(r.tgt+1),
      fr:t1(r.fr),vasch:vn+(vn>1?' vaschette':' vaschetta')+' tipo GN 1/1'};
    let L=[];
    if(N>1)L.push({h:'Lotti',p:'Servono '+N+' lotti da circa '+t1(r.total/N/1000)+' kg di impasto. Ripeti i passaggi dell\'impasto per ogni lotto, con le dosi per lotto.',dur:0,timer:false});
    L=L.concat(mixSteps(inp.mixer,c));
    L.forEach((s,i)=>{s.id='i'+i;s.phase='impasto'});
    const done=ses?ses.done:{},now=Date.now();
    let t=t0;
    L.forEach(s=>{
      if(done[s.id]){s.plan=done[s.id];t=done[s.id]}
      else if(ses&&ses.cur&&ses.cur.id===s.id){s.plan=ses.cur.since;t=Math.max(now,ses.cur.since+s.dur*60000)}
      else{s.plan=t;t+=s.dur*60000}
    });
    const fi=L[L.length-1].plan,ms=60000;
    let stendi=r.bake-(r.proofMin+15)*ms,out=stendi-r.outMin*ms,F=null;const X=[],fiId=L[L.length-1].id;
    /* con l'impasto in frigo gli orari seguono la lievitazione stimata dalle temperature registrate */
    if(ses&&done[fiId]){
      F=fermPlan(ses,r,done[fiId],stendi);
      if(!done.out&&!F.out&&F.outAt!=null)out=F.outAt;
      if(done.out||F.out||F.late)stendi=F.eta!=null?Math.max(F.eta,done.out||0):stendi;
    }
    const W=(id,phase,h,p,at,o)=>X.push(Object.assign({id:id,phase:phase,h:h,p:p,at:at,plan:at,wait:true,dur:0,timer:false},o||{}));
    if(r.foldOn)W('fold','frigo','Piega di rinforzo (facoltativa)','Tira i lembi dall\'esterno verso il centro nella vaschetta, con delicatezza, e ricopri.',fi+120*ms,{anim:'fold',note:'Serve se l\'impasto è uscito dalla macchina poco incordato o se il carico in vasca era basso. Se era già liscio e teso, saltala.'});
    /* niente controlli di notte: si spostano alle 8 del mattino */
    const day=(t,lim)=>{const d=new Date(t),h=d.getHours();if(h>=8&&h<22)return t;const m=new Date(d.getFullYear(),d.getMonth(),d.getDate()+(h>=22?1:0),8,0,0).getTime();return m<lim-3600000?m:t};
    const fr=r.nChk>1?[0.35,0.7]:[0.5];
    fr.forEach((f,i)=>W('chk'+(i+1),'frigo','Controllo in frigo'+(r.nChk>1?' '+(i+1):''),'Guarda le vaschette senza toccare l\'impasto.',day(fi+f*(out-fi),out),{note:'Più che raddoppiato: sposta nel punto più freddo del frigo. Quasi uguale a quando l\'hai messo: è normale, riparte quando esce dal frigo.'}));
    W('out','forno','Fuori dal frigo','Togli le vaschette e lasciale coperte nel locale a '+t1(r.r2)+' °C.',out,{note:'Registra qui sotto la temperatura della stanza e dell\'impasto, poi ogni ora: la stima del raddoppio si aggiorna. È pronto quando è circa raddoppiato.'});
    const paneKg=ses?Math.max(0,+(ses.inp.paneKg||0)):0,paneG=Math.min(paneKg*1000,r.total),nT=Math.max(0,Math.floor((r.total-paneG)/r.g+0.3)),nF=Math.max(1,Math.round(paneG/450));
    W('stendi','forno','Taglia e stendi','Rovescia l\'impasto sul piano infarinato senza sgonfiarlo. '+(paneKg>0?'Taglia '+nT+' pezzi da circa '+gr(r.g)+' per le teglie e tieni da parte '+t1(paneG/1000)+' kg per il pane. ':'Taglia pezzi da circa '+gr(r.g)+'. ')+'Ungi bene la teglia e stendi con i polpastrelli dal centro verso i bordi.',stendi,{anim:'stretch',note:'Se l\'impasto si ritira, lascialo riposare 10 minuti e riprendi. Non usare il mattarello: schiaccia gli alveoli.'});
    if(paneKg>0)X.push({id:'pf',phase:'forno',h:'Forma i filoni',p:'Dividi '+t1(paneG/1000)+' kg di impasto in '+nF+' pezzi da circa 450 g. Allunga ogni pezzo in un rettangolo, arrotolalo stretto e chiudi bene la giuntura sotto. Mettili distanziati su teglia con carta forno e coprili con un telo.',dur:0,timer:false,plan:stendi+5*ms,note:'Lasciali nel posto più fresco, sui 18-20 °C, non al caldo: vanno in forno dopo la pizza.'});
    X.push({id:'proof',phase:'forno',h:'Lievitazione in teglia',p:r.proofMin+' minuti a '+t1(r.pT)+' °C, teglie coperte. Accendi il forno al massimo (250-270 °C) circa 30 minuti prima di infornare.',dur:r.proofMin,timer:true,anim:'poke',plan:stendi+10*ms,note:'Pronta quando è gonfia e l\'impronta del dito torna su piano piano.'});
    const bakeT=F?stendi+(15+r.proofMin)*ms:r.bake;
    X.push({id:'inforna',phase:'forno',h:'Condisci e inforna',p:'Condisci e inforna alla massima temperatura, 15-20 minuti. È cotta quando il bordo è dorato e sotto è croccante. Se la base cuoce piano, teglia sul livello più basso.',dur:15,timer:true,plan:bakeT});
    if(paneKg>0){
      X.push({id:'pforno',phase:'forno',h:'Forno a 170 °C per il pane',p:'Sforna l\'ultima pizza, apri lo sportello qualche minuto e porta il forno a 170 °C, statico, senza vapore. Intanto fai la prova del dito sui filoni.',dur:0,timer:false,plan:bakeT+20*ms});
      X.push({id:'pcuoci',phase:'forno',h:'Cuoci i filoni',p:'170 °C statico, senza vapore, 35-40 minuti. Sono cotti quando, battendo sotto, suonano vuoto.',dur:35,timer:true,plan:bakeT+30*ms});
      X.push({id:'praff',phase:'forno',h:'Copri i filoni con un telo',p:'Appena sfornati coprili con un telo pulito mentre raffreddano: il vapore ammorbidisce la crosta. Non tagliarli prima di 30 minuti.',dur:0,timer:false,plan:bakeT+70*ms});
    }

    steps.forEach(s=>{if(done[s.id])s.doneAt=done[s.id];s.qs=QMAP(s)});
    return {r:r,steps:steps,fi:fi,out:out,F:F,stendiT:r.bake-(r.proofMin+15)*ms,nT:nT,nF:nF,paneG:paneG};
  }
  function state(P,ses){
    ses=ses||SES;

  /* ---- Blocchi di contenuto ---- */
  function doseHtml(r){

      ['Acqua',Math.round(clamp(r.Tmain,0,60))+' °C la parte principale, '+Math.round(clamp(r.Tres,0,30))+' °C quella tenuta da parte',r.ac,gr],

  function animLoop(now){

    var dpr=Math.min(2,window.devicePixelRatio||1);
    live.forEach(function(a){
      var w=a.c.clientWidth;if(!w)return;
      var W=Math.round(w*dpr),H=Math.round(w*.75*dpr);
      if(a.c.width!==W||a.c.height!==H){a.c.width=W;a.c.height=H}
      var x=a.c.getContext('2d');if(!x)return;

    x.fillStyle='#1b1511';x.fillRect(0,0,w,h);
    var tx=-40,ty=18,tw=w+80,th=h-10;
    x.save();x.translate(w/2,h/2);x.rotate(-0.06);x.translate(-w/2,-h/2);
    x.fillStyle='#3d3631';x.fillRect(tx-14,ty-14,tw+28,th+28);
    x.fillStyle='#4b433d';x.fillRect(tx-6,ty-6,tw+12,th+12);

    x.fillStyle=g;x.fillRect(tx,ty,tw,th);
    var i;
    for(i=0;i<70;i++){x.fillStyle='rgba(150,40,20,'+(0.55+rnd()*0.3)+')';x.beginPath();x.ellipse(tx+rnd()*tw,ty+rnd()*th,20+rnd()*40,14+rnd()*30,rnd()*3,0,7);x.fill()}
    for(i=0;i<55;i++){x.fillStyle='rgba(250,240,220,'+(0.75+rnd()*0.25)+')';x.beginPath();x.ellipse(tx+rnd()*tw,ty+rnd()*th,10+rnd()*22,8+rnd()*16,rnd()*3,0,7);x.fill()}
    for(i=0;i<160;i++){x.fillStyle='rgba(90,40,10,'+(0.25+rnd()*0.35)+')';x.beginPath();x.arc(tx+rnd()*tw,ty+rnd()*th,1+rnd()*4,0,7);x.fill()}
    for(i=0;i<22;i++){var lx=tx+rnd()*tw,ly=ty+rnd()*th,a=rnd()*6.3;x.save();x.translate(lx,ly);x.rotate(a);
      x.fillStyle=rnd()>.5?'#2f7a34':'#3f9142';x.beginPath();x.moveTo(-14,0);x.quadraticCurveTo(0,-11,14,0);x.quadraticCurveTo(0,11,-14,0);x.fill();
      x.strokeStyle='rgba(20,50,20,.6)';x.lineWidth=1;x.beginPath();x.moveTo(-12,0);x.lineTo(12,0);x.stroke();x.restore()}
    for(i=0;i<40;i++){x.fillStyle='rgba(255,220,120,.25)';x.beginPath();x.arc(tx+rnd()*tw,ty+rnd()*th,1.5,0,7);x.fill()}
    x.restore();
  }

  function histAvg(H){let s=0,n=0;Object.values(H.j||{}).forEach(J=>CRIT.forEach(([c])=>{if(J[c]){s+=J[c];n++}}));return n?s/n:0}
  function flourCard(){
    let sum=0,n=0,nL=0,dry=0;
    HIST.concat(ALL).forEach(x=>{const st=strength(x);if(st){sum+=st.v*st.n;n+=st.n;nL++}Object.keys(x.q||{}).forEach(k=>{if(k.endsWith(':stick')&&x.q[k]===2)dry++})});
    if(!n)return '<div class="tcard"><div class="lbl">La tua farina</div><p class="sub">Rispondi alle domande rapide durante le lavorazioni: da lì l\'app capisce quanto è forte la farina e ti suggerisce come regolare acqua e tempi.</p></div>';
    const x={v:sum/n},l=sLabel(x);
    const tip=l==='forte'?'Regge acqua e tempi lunghi: la prossima volta prova 3-5 punti di acqua in più.':l==='debole'?'Tieni l\'acqua bassa, accorcia la maturazione e non tirare troppo l\'impasto.':'Comportamento regolare: cambia una cosa per volta e confronta i voti.';
    return '<div class="tcard"><div class="lbl">La tua farina · Rebelde</div><p>Dalle tue risposte sembra <b>'+l+'</b> ('+n+' risposte in '+nL+(nL>1?' lavorazioni':' lavorazione')+').</p><p class="sub">'+tip+(dry?' Più volte l\'impasto non si attaccava alle mani: altro segno che può prendere più acqua.':'')+'</p></div>';
  }
  function histItemHtml(H){
    const P=build(H.inp,H.t0,H),r=P.r,st=strength(H);
    let h='<div class="lbl">'+fmtT(H.t0)+'</div><h1>'+esc(H.name)+'</h1>';
    h+='<table><tbody>'+[['Farina',gr(r.fl)],['Acqua',gr(r.ac)+' · '+Math.round(r.idr*100)+'%'],['Sale',gr(r.sa)],['Olio',gr(r.ol)],['Lievito fresco',gr1(r.lv)+' · '+(Math.round(r.yPct*100)/100).toLocaleString('it-IT')+'%'],['Impastatrice',r.mx.name]]
      .concat(H.meas?[['Impasto a fine lavorazione',t1(+H.meas)+' °C']]:[]).concat(+(H.inp.paneKg||0)>0?[['Pizza / pane',P.nT+' teglie · '+P.nF+' filoni']]:[['Teglie',r.n+' da '+gr(r.g)]])
      .map(x=>'<tr><td>'+x[0]+'</td><td class="v" style="font-size:1.1rem">'+x[1]+'</td></tr>').join('')+'</tbody></table>';
    if(st)h+='<p class="msg">Farina giudicata <b>'+sLabel(st)+'</b> dalle risposte durante la lavorazione.</p>';
    prodsOf(H,P).forEach(([k,n])=>{const J=(H.j||{})[k]||{};
      h+='<div class="tcard"><h2>'+n+'</h2>'+CRIT.map(([c,l])=>'<div class="rate"><span>'+l+'</span><span class="stars">'+(J[c]?J[c]+' / 5':'–')+'</span></div>').join('')+(J.com?'<p>'+esc(J.com)+'</p>':'')+'<div class="phs">'+thumbs(H,'fine-'+k)+'</div></div>'});
    const qa=P.steps.filter(s=>s.qs.some(q=>(H.q||{})[s.id+':'+q]!=null));
    if(qa.length)h+='<h3 class="grp">Risposte durante la lavorazione</h3><ul class="rules">'+qa.map(s=>'<li><b>'+s.h+'</b>: '+s.qs.filter(q=>(H.q||{})[s.id+':'+q]!=null).map(q=>QDEF[q].q.toLowerCase()+' → '+QDEF[q].o[H.q[s.id+':'+q]][0].toLowerCase()).join('; ')+'</li>').join('')+'</ul>';
    const other=(H.photos||[]).filter(p=>!/^fine-/.test(p.s));
    if(other.length)h+='<h3 class="grp">Foto durante la lavorazione</h3><div class="phs">'+other.map(p=>'<img class="ph" data-ph="'+p.k+'" alt="Foto">').join('')+'</div>';
    h+=logHtml(H);
    return h;
  }

  /* ---- Copia di sicurezza ---- */
  function backup(){
    const keys=new Set();HIST.concat(ALL).forEach(x=>(x.photos||[]).forEach(p=>keys.add(p.k)));
    Promise.all([...keys].map(k=>IDB.get(k).then(v=>[k,v]).catch(()=>[k,null]))).then(pairs=>{
      const foto={};pairs.forEach(([k,v])=>{if(v)foto[k]=v});
      const data={app:'lievitati',v:1,at:Date.now(),set:S,all:ALL,hist:HIST,places:PLACES,foto:foto};
      const d=new Date(),a=document.createElement('a');
      a.href=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:'application/json'}));
      a.download='lievitati-copia-'+d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'.json';
      document.body.appendChild(a);a.click();a.remove();
      bkMsg='Copia salvata nella cartella Download ('+HIST.length+' nello storico, '+ALL.length+' in corso, '+Object.keys(foto).length+' foto).';render();
    });
  }
  function restore(file){
    const fr=new FileReader();
    fr.onload=()=>{
      let d;try{d=JSON.parse(fr.result)}catch(e){bkMsg='Il file non è una copia valida.';render();return}
      if(!d||d.app!=='lievitati'){bkMsg='Il file non è una copia di questa app.';render();return}
      const h0=new Set(HIST.map(x=>x.t0)),a0=new Set(ALL.map(x=>x.t0));
      let nh=0,na=0;
      (d.hist||[]).forEach(x=>{if(!h0.has(x.t0)){HIST.push(x);nh++}});
      (d.all||[]).forEach(x=>{if(!a0.has(x.t0)&&!h0.has(x.t0)){ALL.push(x);na++}});
      HIST.sort((a,b)=>b.t0-a.t0);
      if(d.places&&d.places.length&&!store.get('lv-places')){PLACES=d.places;savePl()}
      Promise.all(Object.keys(d.foto||{}).map(k=>IDB.put(k,d.foto[k]).catch(()=>{}))).then(()=>{
        saveHist();saveSes();bkMsg='Copia caricata: '+nh+' nello storico e '+na+' in corso aggiunte.';render();
      });
    };
    fr.readAsText(file);
  }

      top.innerHTML='<span class="brand">Lievitati Scacchiera</span>';
      if(screen==='hist'){

            '<span><b>'+esc(H.name)+'</b><span class="sub">'+fmtT(H.t0)+' · '+t1(H.fz.total/1000)+' kg</span><br>'+(avg?'<span class="stars">'+t1(avg)+' / 5</span>':'<span class="sub">senza voto</span>')+'</span></button></li>';
        }).join('')+'</ul>':'<p class="sub">Ancora vuoto: le lavorazioni finite compaiono qui con voti, foto e misure.</p>');

        bar.innerHTML='<button type="button" class="btn ghost" data-act="hist">Indietro</button><button type="button" class="btn ghost danger" data-act="hdel">'+(confirmEnd?'Conferma eliminazione':'Elimina')+'</button>';
        fillPhotos();lastSig='hitem';return;
      }
      if(screen==='places'){
        v.innerHTML='<h1>Posti e temperature</h1><p class="sub">I posti dove tieni l\'impasto, con la temperatura tipica. "Freddo" vale per frigo e cella.</p><div class="stack">'+
          PLACES.map((p,i)=>'<div class="plrow"><input type="text" data-pl="'+i+'|n" value="'+esc(p.n)+'" aria-label="Nome"><input type="number" data-pl="'+i+'|t" step="0.5" inputmode="decimal" value="'+p.t+'" aria-label="Temperatura"><label class="mini"><input type="checkbox" data-pl="'+i+'|c"'+(p.c?' checked':'')+'>Freddo</label><button type="button" class="x" data-act="pldel" data-i="'+i+'" aria-label="Elimina">×</button></div>').join('')+
          '</div><button type="button" class="btn ghost small" data-act="pladd">Aggiungi un posto</button>';
        bar.innerHTML='<button type="button" class="btn big" data-act="home">Fatto</button>';
        lastSig='places';return;
      }
      const fl=flourCard();
      v.innerHTML='<h1>Lievitati</h1>'+(ALL.length?'<h3 class="grp">In corso</h3><ul class="list">'+ALL.map((ses,i)=>{
        const P=build(ses.inp,ses.t0,ses),n=P.steps.length,dn=P.steps.filter(x=>ses.done[x.id]).length,pc=Math.round(dn/n*100);
        return '<li><button type="button" class="job" data-open="'+i+'"><b>'+P.r.P.name+(+(ses.inp.paneKg||0)>0?' e pane':'')+'</b><span class="sub">'+t1(P.r.total/1000)+' kg · iniziata '+fmtT(ses.t0)+'</span>'+
          '<div class="pbar'+(pc===100?' full':'')+'"><div style="width:'+pc+'%"></div></div><span class="st" id="hc'+i+'"></span></button></li>';
      }).join('')+'</ul>':'<p class="sub">Nessuna lavorazione in corso.</p>')+fl+
        '<h3 class="grp">Altro</h3><div class="actions"><button type="button" class="btn ghost small" data-act="hist">Storico ('+HIST.length+')</button><button type="button" class="btn ghost small" data-act="places">Posti e temperature</button></div>'+
        '<div class="actions"><button type="button" class="btn ghost small" data-act="backup">Salva copia</button><button type="button" class="btn ghost small" data-act="restore">Carica copia</button></div>'+
        '<p class="sub">Dati e foto restano solo in questo telefono. Ogni tanto salva una copia e tienila in un posto sicuro (Drive, PC).</p>'+(bkMsg?'<p class="msg">'+bkMsg+'</p>':'')+
        '<p class="ver">Versione '+VERSION+' · <button type="button" class="btn ghost small" data-act="reload" style="display:inline-block">Ricarica</button></p>';
      bar.innerHTML='<button type="button" class="btn big" data-act="new">Nuova lavorazione</button>';
      lastSig=homeSig();paintHome();return;
    }
    if(!SES){
      const t0=startMs(),r=compute(S,t0),m=timeMsg(r,t0);
      top.innerHTML='<span class="brand">Lievitati Scacchiera</span><span class="dots">'+WZ.map((w,i)=>'<i'+(i<=wiz?' class="on"':'')+'></i>').join('')+'</span>';
      v.innerHTML=WZ[wiz].html(r,t0);derived();
      bar.innerHTML=(wiz>0?'<button type="button" class="btn ghost" data-act="prev">Indietro</button>':'<button type="button" class="btn ghost" data-act="home">Annulla</button>')+
        (wiz<WZ.length-1?'<button type="button" class="btn big" data-act="next">Avanti</button>':'<button type="button" class="btn big" data-act="start"'+(m.block?' disabled':'')+'>Inizia la preparazione</button>');
      if($('art'))try{drawArt()}catch(e){}
      lastSig='wiz'+wiz;return;
    }
    const P=build(SES.inp,SES.t0,SES),stt=state(P),n=P.steps.length,dn=P.steps.filter(s=>SES.done[s.id]).length,pc=Math.round(dn/n*100);
    top.innerHTML='<div class="pbar'+(pc===100?' full':'')+'" role="progressbar" aria-label="Completamento" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+pc+'"><div style="width:'+pc+'%"></div></div><span class="cnt">'+dn+' di '+n+'</span><button type="button" class="bell'+(notifOn()?' on':'')+'" data-act="bell">'+(notifOn()?'Avvisi attivi':'Avvisi spenti')+'</button>';
    if(view==='sum'){
      v.innerHTML=sumHtml(P,stt);
      bar.innerHTML='<button type="button" class="btn ghost nav" data-act="home">Lavorazioni</button><button type="button" class="btn big" data-act="back">Torna a cosa fare adesso</button>';
    }else{
      v.innerHTML=nowHtml(P,stt);
      if(stt.s&&stt.s.anim&&$('how'))addHowto($('how'),stt.s.anim,stt.s.id);
      fillPhotos();
      bar.innerHTML='<button type="button" class="btn ghost nav" data-act="home">Lavorazioni</button><button type="button" class="btn ghost nav" data-act="sum">Riepilogo</button>'+
        (stt.mode==='end'?'<button type="button" class="btn big" data-act="endnow">Salva nello storico</button>':'<button type="button" class="btn big" data-act="done">'+(stt.mode==='wait'?'Già fatto':'Fatto')+'</button>');
    }
    lastSig=sigOf(stt);paint(stt);
    if(stt.s&&stt.s.phase==='impasto')keepAwake();else releaseAwake();
  }
  const sigOf=stt=>view+'|'+sumTab+'|'+(stt.s?stt.s.id:'end')+'|'+stt.mode+'|'+(SES?SES.t0:0);
  function paint(stt){
    const fs=$('fst');if(fs&&SES){const P=build(SES.inp,SES.t0,SES);if(P.F)fs.innerHTML=fstText(P)}
    const cd=$('cd');if(!cd)return;
    const now=Date.now();
    cd.textContent=stt.mode==='wait'?'tra '+left(stt.s.at-now):stt.mode==='run'?left(stt.end-now):'00:00';
  }
  function stText(P,stt){
    const now=Date.now();
    if(stt.mode==='end')return 'Finita';
    if(stt.mode==='wait')return 'In attesa: '+stt.s.h+' · tra '+left(stt.s.at-now);
    if(stt.mode==='run')return 'Adesso: '+stt.s.h+' · '+left(stt.end-now);
    if(stt.mode==='over')return 'Tempo scaduto: '+stt.s.h;
    return 'Da fare adesso: '+stt.s.h;
  }
  const homeSig=()=>'home|'+ALL.map(ses=>{const st=state(build(ses.inp,ses.t0,ses),ses);return ses.t0+(st.s?st.s.id:'end')+st.mode}).join(',');
  function paintHome(){
    ALL.forEach((ses,i)=>{const el=$('hc'+i);if(!el)return;const P=build(ses.inp,ses.t0,ses),st=state(P,ses);el.textContent=stText(P,st);el.className='st'+(st.mode==='over'||st.mode==='do'?' hot':'')});
  }
  function tick(){
    const now=Date.now();let open=null;
    ALL.forEach(ses=>{
      const P=build(ses.inp,ses.t0,ses),stt=state(P,ses),tag=ALL.length>1?P.r.P.name+': ':'';
      ses.fired=ses.fired||{};
      if(stt.s){
        const s=stt.s;
        if(stt.mode==='over'&&!ses.fired[s.id]){ses.fired[s.id]=1;saveSes();if(now-stt.end<10*60000)notify(tag+'tempo scaduto, '+s.h,'Quando hai finito, premi Fatto.')}
        if(s.wait&&now>=s.at&&!ses.fired['at:'+s.id]){ses.fired['at:'+s.id]=1;saveSes();if(now-s.at<3*60000&&now-ses.cur.since>5000)notify(tag+'ora '+s.h,s.p)}
      }
      if(isOut(ses)&&stt.mode!=='end'){const l=ses.log,last=l[l.length-1].t;if(now-last>60*60000){const k='tm:'+last+':'+Math.floor((now-last)/3600000);if(!ses.fired[k]){ses.fired[k]=1;saveSes();notify(tag+'misura la temperatura','Impasto fuori dal frigo: misura impasto e stanza e registrali.')}}}
      if(ses===SES)open=stt;
    });
    if(SES&&open){if(sigOf(open)!==lastSig)render();else paint(open)}
    else if(!SES&&screen==='home'){if(homeSig()!==lastSig)render();else paintHome()}
  }
  setInterval(tick,1000);
  /* controlla se su GitHub c'è una versione più nuova e lo dice con un tasto verde */
  function checkUpd(){
    if(location.protocol!=='https:')return;
    try{fetch('./?u='+Date.now(),{cache:'no-store'}).then(r=>r.text()).then(t=>{
      const m=t.match(/const VERSION='([^']+)'/);
      if(m&&m[1]!==VERSION&&!$('updb')){const b=document.createElement('button');b.id='updb';b.className='upd';b.dataset.act='upd';b.textContent='Nuova versione '+m[1]+': tocca per aggiornare';document.body.appendChild(b)}
    }).catch(()=>{})}catch(e){}
  }
  checkUpd();setInterval(checkUpd,15*60000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkUpd()});
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});

  /* ---- Azioni ---- */
  function complete(id){SES.done[id]=Date.now();if(id==='out'&&!isOut(SES))addLog(SES,{k:'out',amb:num(SES.inp.room2,18)});saveSes();render()}
  function readT(){const d=$('tD'),a=$('tA'),e={};if(d&&d.value!==''&&isFinite(+d.value))e.dough=+d.value;if(a&&a.value!==''&&isFinite(+a.value))e.amb=+a.value;return e}
  document.addEventListener('click',e=>{
    const t=e.target.closest('[data-act],[data-tab],[data-toggle],[data-mixer],[data-open],[data-ans],[data-rate],[data-place],[data-hist]');if(!t)return;
    if(t.dataset.ans&&SES){
      const [sid,q,i]=t.dataset.ans.split('|'),k=sid+':'+q;SES.q=SES.q||{};
      if(SES.q[k]===+i)delete SES.q[k];else{SES.q[k]=+i;const o=QDEF[q].o[+i];if(q==='vol'&&o[3]!=null)addLog(SES,{k:'v',v:o[3]})}
      saveSes();lastSig='';render();return;
    }
    if(t.dataset.rate&&SES){const [k,c,v]=t.dataset.rate.split('|');SES.j=SES.j||{};SES.j[k]=SES.j[k]||{};SES.j[k][c]=SES.j[k][c]===+v?0:+v;saveSes();const sc=$('view').scrollTop;render();$('view').scrollTop=sc;return}
    if(t.dataset.place!=null){selPlace=+t.dataset.place;document.querySelectorAll('[data-place]').forEach(b=>b.classList.toggle('on',b===t));const a=$('tA');if(a&&PLACES[selPlace])a.value=PLACES[selPlace].t;return}
    if(t.dataset.hist!=null){histSel=+t.dataset.hist;screen='hitem';confirmEnd=false;render();$('view').scrollTop=0;return}
    const a=t.dataset.act;
    if(t.dataset.open){SES=ALL[+t.dataset.open]||null;view='now';confirmEnd=false;render();$('view').scrollTop=0;return}
    if(t.dataset.mixer){S.mixer=t.dataset.mixer;S.cap=MIXERS[S.mixer].cap;S.fric='';saveS();render();return}
    if(t.dataset.tab){sumTab=t.dataset.tab;confirmEnd=false;render();$('view').scrollTop=0;return}
    if(t.dataset.toggle){const id=t.dataset.toggle;if(SES.done[id])delete SES.done[id];else SES.done[id]=Date.now();saveSes();render();return}
    if(a==='home'){SES=null;screen='home';bkMsg='';view='now';confirmEnd=false;releaseAwake();render();$('view').scrollTop=0}
    else if(a==='new'){screen='wiz';wiz=0;fixDates();render();$('view').scrollTop=0}
    else if(a==='next'){wiz=Math.min(WZ.length-1,wiz+1);render();$('view').scrollTop=0}
    else if(a==='prev'){wiz=Math.max(0,wiz-1);render();$('view').scrollTop=0}
    else if(a==='startnow'){S.start=toInput(new Date());saveS();render()}
    else if(a==='start'){
      const t0=Date.now(),inp=Object.assign({},S),r=compute(inp,t0),fz={};
      FZ.forEach(k=>{fz[k]=r[k]});
      SES={inp:inp,t0:t0,done:{},cur:null,fired:{},meas:'',fz:fz};ALL.push(SES);saveSes();
      view='now';sumTab='steps';ensureAudio();askNotif();render();$('view').scrollTop=0;
    }
    else if(a==='done'){const stt=state(build(SES.inp,SES.t0,SES));if(stt.s)complete(stt.s.id);$('view').scrollTop=0}
    else if(a==='retimer'){SES.cur.since=Date.now();const stt=state(build(SES.inp,SES.t0,SES));if(stt.s)delete SES.fired[stt.s.id];saveSes();ensureAudio();lastSig='';tick()}
    else if(a==='sum'){view='sum';render();$('view').scrollTop=0}
    else if(a==='back'){view='now';confirmEnd=false;render();$('view').scrollTop=0}
    else if(a==='logm'||a==='logout'||a==='login'){
      const e=readT(),pl=selPlace!=null?PLACES[selPlace]:null,out=isOut(SES);
      if(a==='logm'){
        if(pl){e.p=pl.n;if(e.amb==null)e.amb=pl.t;e.k=pl.c?(out?'in':'m'):(out?'m':'out')}
        else{if(e.dough==null&&e.amb==null)return;e.k='m'}
      }
      else{e.k=a==='logout'?'out':'in';if(e.amb==null)e.amb=a==='logout'?num(SES.inp.room2,18):num(SES.inp.fridge,4)}
      selPlace=null;
      if(e.amb!=null){if(e.k==='out'||(e.k==='m'&&isOut(SES)))SES.inp.room2=e.amb;else SES.inp.fridge=e.amb}
      addLog(SES,e);render();
    }
    else if(a==='photo'){photoKey=t.dataset.pk||'';$('pick').value='';$('pick').click()}
    else if(a==='hist'){screen='hist';confirmEnd=false;render();$('view').scrollTop=0}
    else if(a==='hdel'){if(!confirmEnd){confirmEnd=true;render()}else{const H=HIST[histSel];(H.photos||[]).forEach(p=>IDB.del(p.k).catch(()=>{}));HIST.splice(histSel,1);saveHist();confirmEnd=false;screen='hist';render()}}
    else if(a==='places'){screen='places';render();$('view').scrollTop=0}
    else if(a==='pladd'){PLACES.push({n:'Nuovo posto',t:20});savePl();render()}
    else if(a==='pldel'){PLACES.splice(+t.dataset.i,1);savePl();render()}
    else if(a==='backup')backup();
    else if(a==='reload'||a==='upd'){location.reload()}
    else if(a==='restore'){$('loadb').value='';$('loadb').click()}
    else if(a==='notif')askNotif();
    else if(a==='bell'){if(('Notification' in window)&&Notification.permission==='default')askNotif();else{view='sum';sumTab='altro';render();$('view').scrollTop=0}}
    else if(a==='testn')notify('Notifica di prova','Se la vedi e la senti, gli avvisi funzionano.');
    else if(a==='ics')downloadIcs();
    else if(a==='calib'){S.fric=+t.dataset.v;saveS();t.textContent='Salvato per la prossima volta';t.disabled=true}
    else if(a==='end'){if(!confirmEnd){confirmEnd=true;render()}else endSes()}
    else if(a==='endnow')endSes();
  });
  function endSes(){
    if(Object.keys(SES.done).length){
      const P=build(SES.inp,SES.t0,SES);
      HIST=HIST.filter(x=>x.t0!==SES.t0);
      HIST.unshift(Object.assign({},SES,{name:P.r.P.name+(+(SES.inp.paneKg||0)>0?' e pane':''),end:Date.now()}));saveHist();
    }
    ALL=ALL.filter(x=>x!==SES);SES=null;saveSes();confirmEnd=false;wiz=0;view='now';screen='home';releaseAwake();fixDates();render();
  }
  $('pick').addEventListener('change',e=>{
    const f=e.target.files&&e.target.files[0];if(!f||!SES)return;
    const ses=SES,key=photoKey;
    shrink(f).then(d=>{const k='f'+Date.now();phCache[k]=d;return IDB.put(k,d).then(()=>{ses.photos=ses.photos||[];ses.photos.push({k:k,s:key,t:Date.now()});saveSes();const sc=$('view').scrollTop;lastSig='';render();$('view').scrollTop=sc})})
      .catch(()=>{});
  });
  $('loadb').addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];if(f)restore(f)});
  $('view').addEventListener('input',e=>{
    const el=e.target;
    if(el.dataset.k&&!SES){
      const k=el.dataset.k;
      S[k]=el.type==='number'?(el.value===''?'':parseFloat(el.value)):el.value;
      if(k==='prod'||k==='fmt'){S.g='';if(k==='prod')S.idr=''}
      saveS();
      if(el.dataset.rr!==undefined)render();else{derived();if(k==='bake'||k==='start'){const b=document.querySelector('[data-act=start]');if(b)b.disabled=!!timeMsg(compute(S,startMs()),startMs()).block}}
    }else if(el.dataset.com&&SES){
      const k=el.dataset.com;SES.j=SES.j||{};SES.j[k]=SES.j[k]||{};SES.j[k].com=el.value;saveSes();
    }else if(el.dataset.pl){
      const [i,f]=el.dataset.pl.split('|'),p=PLACES[+i];if(!p)return;
      if(f==='n')p.n=el.value;else if(f==='t'){if(el.value!==''&&isFinite(+el.value))p.t=+el.value}else p.c=el.checked?1:0;
      savePl();
    }else if(el.dataset.meas!==undefined&&SES){
      SES.meas=el.value;saveSes();$('measmsg').innerHTML=measHtml(build(SES.inp,SES.t0,SES).r);
    }
  });
  $('view').addEventListener('change',e=>{
    const el=e.target;
    if(el.dataset.sk&&SES){
      const v=el.type==='number'?parseFloat(el.value):el.value;
      if(el.dataset.sk==='paneKg'&&el.value==='')SES.inp.paneKg=0;
      else if(el.type==='number'?isFinite(v):isFinite(new Date(v).getTime())){SES.inp[el.dataset.sk]=v;if(el.dataset.sk==='room2')delete SES.inp.outH;saveSes()}
      render();
    }else if(el.id==='awake'){awakeOn=el.checked;store.set('lv-awake',awakeOn?1:0);if(awakeOn)keepAwake();else releaseAwake()}
  });

  /* ---- Avvio ---- */
  function fixDates(){
    const now=new Date(),s=new Date(S.start).getTime(),b=new Date(S.bake).getTime();
    if(!isFinite(s)||s<now.getTime()-3600000)S.start=toInput(now);
    if(!isFinite(b)||b<now.getTime())S.bake=toInput(new Date(now.getFullYear(),now.getMonth(),now.getDate()+2,20,0,0));
    saveS();
  }
  /* passaggio dalla versione precedente: recupera impostazioni e preparazione già in frigo */
  if(!store.get('lv-mig')){
    store.set('lv-mig',1);
    const o=store.get('pizza-state');
    if(o&&!store.get('lv-set')){
      ['n','fmt','mixer','cap','room','flourT','target','fric','fridge','room2','proofT','bake'].forEach(k=>{if(o[k]!=null&&o[k]!==0)S[k]=o[k]});
      if(o.style&&PRODUCTS['teglia-'+o.style])S.prod='teglia-'+o.style;
      if(o.g)S.g=o.g;if(o.idr)S.idr=o.idr;
      const t0=new Date(o.started).getTime(),b=new Date(o.bake).getTime();
      if(o.started&&isFinite(t0)&&isFinite(b)&&b>Date.now()&&Date.now()-t0<4*86400000){
        const inp=Object.assign({},S),r=compute(inp,t0),fz={};
        FZ.forEach(k=>{fz[k]=r[k]});
        SES={inp:inp,t0:t0,done:{},cur:null,fired:{},meas:o.meas||'',fz:fz};ALL.push(SES);
        const tf=Math.min(Date.now(),t0+80*60000);
        build(inp,t0,SES).steps.forEach(s=>{if(s.phase==='impasto'||s.id==='fold')SES.done[s.id]=tf});
        saveSes();
      }
    }
  }
  ALL=ALL.filter(x=>x&&x.inp&&x.done&&PRODUCTS[x.inp.prod]);
  /* preparazioni iniziate prima del 16/11: il lievito pesato era quello della vecchia formula (base 0,07%) */
  ALL.forEach(x=>{if(x.fz&&x.t0<Date.parse('2026-11-15T23:30:00Z')&&x.fz.yPct>0.15){x.fz.yPct=x.fz.yPct*0.07/0.25;x.fz.lv=x.fz.fl*x.fz.yPct/100}});
  /* impasto del 15/11: frigo a 2,5 °C, fuori dalle 9:17 alle 13:35 del 16/11, impasto a 15 °C alle 13:32 */
  ALL.forEach(x=>{if(x.t0<Date.parse('2026-11-15T23:30:00Z')&&!x.log){x.inp.fridge=2.5;x.inp.room2=20;delete x.inp.outH}if(x.t0<Date.parse('2026-11-15T23:30:00Z')&&!x.log)x.log=[{t:x.t0+81*60000,k:'in',amb:2.5},{t:Date.parse('2026-11-16T08:17:00Z'),k:'out',amb:20.5},{t:Date.parse('2026-11-16T10:45:00Z'),k:'m',amb:19.2},{t:Date.parse('2026-11-16T12:32:00Z'),k:'m',dough:15,amb:19.2},{t:Date.parse('2026-11-16T12:35:00Z'),k:'in',amb:2.5}]});
  saveSes();
  /* sera del 16/11: sbrinamento, impasto a 7 °C con frigo a 10 °C alle 18:06, frigo di nuovo a 2,5 °C verso le 18:45 */
  ALL.forEach(x=>{if(x.t0<Date.parse('2026-11-15T23:30:00Z')&&x.log&&!x.log.some(e=>e.t>=Date.parse('2026-11-16T16:30:00Z'))){x.log.push({t:Date.parse('2026-11-16T17:06:00Z'),k:'m',dough:7,amb:10},{t:Date.parse('2026-11-16T17:45:00Z'),k:'m',amb:2.5})}});
  saveSes();
  SES=ALL.length===1?ALL[0]:null;screen='home';
  if(!PRODUCTS[S.prod])S.prod='teglia-classica';
  if(!MIXERS[S.mixer])S.mixer='mono';
  fixDates();
  render();
})();
</script>
</body>
